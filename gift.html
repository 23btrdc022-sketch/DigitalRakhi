<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Last Surprise ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background:
                radial-gradient(circle at top,
                    #64152f,
                    #100207 75%);

            font-family: Georgia, serif;
            color: #ffe9c0;
        }

        .card {
            width: min(600px, 95%);
            padding: 45px 30px;

            text-align: center;

            background: rgba(35, 6, 18, 0.97);

            border:
                1px solid rgba(255, 215, 140, 0.65);

            border-radius: 30px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.7);

            animation: appear 0.8s ease;
        }

        .small {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            color: #d9a94f;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;

            color: #ffd98f;

            font-size: 38px;

            font-weight: normal;
        }

        .message {
            margin: 25px auto;

            max-width: 480px;

            color: #f0d8dc;

            font-size: 18px;

            line-height: 1.8;
        }

        .emoji {
            font-size: 55px;
            margin: 20px 0;
        }

        .tax {
            color: #ffd98f;
            font-size: 24px;
            margin: 20px 0 10px;
        }

        .sub {
            color: #d9c0c7;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .qr-box {
            width: 240px;
            height: 240px;

            margin: 25px auto;

            display: flex;
            justify-content: center;
            align-items: center;

            background: white;

            border-radius: 18px;

            padding: 15px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.4);
        }

        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .note {
            color: #cfaeb7;
            font-family: Arial, sans-serif;
            font-size: 13px;
            margin-top: 20px;
        }

        .again {
            display: inline-block;

            margin-top: 25px;

            padding: 13px 25px;

            border:
                1px solid #e8bd65;

            border-radius: 50px;

            background:
                linear-gradient(135deg,
                    #851d3a,
                    #481020);

            color: #ffe4a1;

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-weight: bold;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform:
                    translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0) scale(1);
            }
        }

        @media (max-width: 500px) {

            h1 {
                font-size: 30px;
            }

            .card {
                padding: 35px 20px;
            }

            .qr-box {
                width: 210px;
                height: 210px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="small">
            WAIT... ONE LAST THING 👀
        </div>

        <h1>
            Don't Leave Yet ❤️
        </h1>

        <div class="emoji">
            🎀
        </div>

        <div class="message">
            You've received your Rakhi.<br>
            You've received your letter. 💌
            <br><br>

            But there's <strong>one tiny thing</strong> left...
        </div>

        <div class="tax">
            THE SISTER TAX 😂❤️
        </div>

        <div class="sub">
            Because being the favourite sister isn't free. 😌
        </div>

        <div class="qr-box">

            <!--
                TEMPORARY QR IMAGE

                Later replace this image with
                your own QR image.
            -->

            <img src="qr-placeholder.jpeg" alt="QR Code">

        </div>

        <div class="note">
            A tiny contribution to the Sister Happiness Fund. 😂
        </div>

        <a class="again" href="index.html">
            🎀 EXPERIENCE AGAIN
        </a>

    </div>

</body>

</html>
