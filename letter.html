<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Your Rakhi Letter ❤️</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px 15px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #751d3c 0%,
            #3b0d20 35%,
            #100207 85%
        );

    color: #ffe9c0;

    font-family: Georgia, serif;

    overflow-x: hidden;

}


/* =====================================================
   DECORATIVE GLOW
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 280px;

    height: 280px;

    top: -130px;

    left: 50%;

    transform: translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(255, 210, 130, 0.16),
            transparent 70%
        );

    pointer-events: none;

}


/* =====================================================
   LETTER CARD
===================================================== */

.letter-card {

    position: relative;

    width: min(650px, 100%);

    padding: 45px 40px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(62, 11, 31, 0.97),
            rgba(25, 4, 14, 0.98)
        );

    border:
        1px solid rgba(255, 215, 140, 0.55);

    box-shadow:

        0 30px 90px rgba(0, 0, 0, 0.7),

        0 0 50px rgba(255, 190, 90, 0.10);

    text-align: center;

    animation:
        appear 0.8s ease;

}


/* =====================================================
   TOP LABEL
===================================================== */

.label {

    margin-bottom: 14px;

    color: #d9a94f;

    font-family: Arial, sans-serif;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 4px;

}


/* =====================================================
   TITLE
===================================================== */

h1 {

    margin: 0;

    color: #ffd98f;

    font-size: clamp(
        30px,
        6vw,
        40px
    );

    font-weight: normal;

    line-height: 1.25;

}


/* =====================================================
   RAKHI
===================================================== */

.rakhi {

    margin: 20px 0 18px;

    font-size: 48px;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(255, 150, 100, 0.25)
        );

}


/* =====================================================
   GOLD LINE
===================================================== */

.line {

    width: 70px;

    height: 2px;

    margin: 22px auto 30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e8bd65,
            transparent
        );

}


/* =====================================================
   LETTER
===================================================== */

#letter {

    text-align: left;

    white-space: pre-line;

    color: #f0d8dc;

    font-size: 18px;

    line-height: 1.9;

}


/* =====================================================
   SIGNATURE
===================================================== */

.signature {

    margin-top: 35px;

    padding-top: 20px;

    border-top:
        1px solid
        rgba(255, 215, 140, 0.12);

    text-align: right;

    color: #ffd98f;

    font-size: 19px;

    line-height: 1.7;

}


/* =====================================================
   BUTTON
===================================================== */

.again-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    max-width: 280px;

    min-height: 52px;

    margin-top: 30px;

    padding: 14px 22px;

    border:
        1px solid
        rgba(232, 189, 101, 0.8);

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #8b1f3e,
            #4b1022
        );

    color: #ffe4a1;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 0.5px;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.3);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


.again-button:active {

    transform: scale(0.97);

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 700px) {

    body {

        align-items: flex-start;

        padding:
            35px 15px;

    }

    .letter-card {

        padding:
            38px 28px;

    }

}


/* =====================================================
   PHONE
===================================================== */

@media (max-width: 500px) {

    body {

        min-height: 100svh;

        padding:
            20px 12px;

        align-items: center;

    }


    .letter-card {

        width: 100%;

        padding:
            30px 21px 25px;

        border-radius: 25px;

        box-shadow:
            0 20px 60px
            rgba(0, 0, 0, 0.65);

    }


    .label {

        font-size: 9px;

        letter-spacing: 3px;

        margin-bottom: 12px;

    }


    h1 {

        font-size: 29px;

        line-height: 1.3;

    }


    .rakhi {

        margin:
            16px 0;

        font-size: 42px;

    }


    .line {

        width: 55px;

        margin:
            18px auto 25px;

    }


    #letter {

        font-size: 16px;

        line-height: 1.85;

        color: #f1dce0;

    }


    .signature {

        margin-top: 28px;

        padding-top: 18px;

        font-size: 17px;

    }


    .again-button {

        max-width: none;

        margin-top: 25px;

        min-height: 50px;

        font-size: 13px;

    }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    body {

        padding:
            12px 9px;

    }


    .letter-card {

        padding:
            25px 17px 20px;

        border-radius: 22px;

    }


    .label {

        font-size: 8px;

        letter-spacing: 2.5px;

    }


    h1 {

        font-size: 26px;

    }


    .rakhi {

        font-size: 38px;

        margin:
            13px 0;

    }


    #letter {

        font-size: 15px;

        line-height: 1.75;

    }


    .signature {

        font-size: 16px;

    }

}


/* =====================================================
   TOUCH DEVICES
===================================================== */

@media (hover: none) {

    .again-button:hover {

        transform: none;

    }

}

</style>

</head>


<body>


<div class="letter-card">


    <div class="label">
        THIS ONE IS JUST FOR YOU ✦
    </div>


    <h1 id="brotherTitle">
        Happy Rakhi ❤️
    </h1>


    <div class="rakhi">
        🎀
    </div>


    <div class="line"></div>


    <div id="letter">
        Loading your letter...
    </div>


    <div class="signature">

        With lots of love,<br>

        Your Sister ❤️

    </div>


    <a
        class="again-button"
        href="index.html"
    >

        🎀 EXPERIENCE AGAIN

    </a>


</div>


<script>


/* =====================================================
   BROTHER DATA
===================================================== */

const brothers = {


    "Aadi": {

        title:
            "Happy Rakhi, Aadi! ❤️",

        letter:
            `We fight like crazy, but I know you love me the most, and I love you just as much.

No matter how much we fight, you’ll always be my favourite headache. 😂`

    },


    "Aryan": {

        title:
            "Happy Rakhi, Golu! ❤️",

        letter:
            `You’re always feeding me everything you love, and somehow that’s your way of showing love.

Stay sweet and caring always. Love you! 🫶`

    },


    "Ashish": {

        title:
            "Happy Rakhi, Ashish! ❤️",

        letter:
            `We don’t talk much, but I’ve always found you mature and sensible.

I’m glad to have you as my brother. Stay the same!`

    },


    "Manish Bhaiya": {

        title:
            "Happy Rakhi, Bhaiya! ❤️",

        letter:
            `You’re the eldest and the one who cares for everyone.

Thank you for always looking after us. We’re lucky to have you. ❤️`

    },


    "Sandip Bhaiya": {

        title:
            "Happy Rakhi, Bhaiya! ❤️",

        letter:
            `Happy Rakhi to our funniest and shyest brother! 😂❤️

And of course, our amazing cook!

You may be quiet, but you always make things better.

Love you, Bhaiya!`

    },


    "Prince Bhaiya": {

        title:
            "Happy Rakhi, Bhaiya! ❤️",

        letter:
            `We may not talk much, but you’re still deeply loved and an important part of our family.

Stay happy always!`

    },


    "Mandip Bhaiya": {

        title:
            "Happy Rakhi to the craziest and most annoying one! 😂❤️",

        letter:
            `You’re always drunk and up to something, but somehow we share a really special bond.

Life would be boring without you!

Love you, Bhaiya.`

    }

};


/* =====================================================
   GET SELECTED BROTHER
===================================================== */

const selectedBrother =
    localStorage.getItem(
        "selectedBrother"
    );


const brotherTitle =
    document.getElementById(
        "brotherTitle"
    );


const letter =
    document.getElementById(
        "letter"
    );


/* =====================================================
   DISPLAY LETTER
===================================================== */

if (
    selectedBrother &&
    brothers[selectedBrother]
) {

    const brother =
        brothers[selectedBrother];


    brotherTitle.textContent =
        brother.title;


    letter.textContent =
        brother.letter;


    console.log(
        "Showing letter for:",
        selectedBrother
    );

}


/* =====================================================
   ERROR
===================================================== */

else {

    brotherTitle.textContent =
        "Oops! ❤️";


    letter.textContent =
        "We couldn't find your Rakhi selection. Please go back and choose your name again.";


    console.log(
        "No valid brother selection found."
    );

}

</script>


</body>

</html>
