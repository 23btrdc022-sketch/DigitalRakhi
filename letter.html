<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Your Rakhi Letter ❤️</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding: 25px 15px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #751d3c 0%,
            #3b0d20 35%,
            #100207 85%
        );

    color: #ffe9c0;

    font-family: Georgia, serif;

    overflow-x: hidden;
    overflow-y: auto;

}


/* =====================================================
   DECORATIVE GLOW
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 300px;

    height: 300px;

    top: -140px;

    left: 50%;

    transform: translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(255, 210, 130, 0.16),
            transparent 70%
        );

    pointer-events: none;

}


/* =====================================================
   LETTER CARD
===================================================== */

.letter-card {

    position: relative;

    width: min(650px, 100%);

    margin: 15px auto 30px;

    padding: 45px 40px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(62, 11, 31, 0.97),
            rgba(25, 4, 14, 0.98)
        );

    border:
        1px solid rgba(255, 215, 140, 0.55);

    box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.7),
        0 0 50px rgba(255, 190, 90, 0.10);

    text-align: center;

    animation: appear 0.8s ease;

}


/* =====================================================
   TOP LABEL
===================================================== */

.label {

    margin-bottom: 14px;

    color: #d9a94f;

    font-family: Arial, sans-serif;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 4px;

}


/* =====================================================
   TITLE
===================================================== */

h1 {

    margin: 0;

    color: #ffd98f;

    font-size: clamp(30px, 6vw, 40px);

    font-weight: normal;

    line-height: 1.25;

}


/* =====================================================
   RAKHI
===================================================== */

.rakhi {

    margin: 20px 0 18px;

    font-size: 48px;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(255, 150, 100, 0.25)
        );

}


/* =====================================================
   GOLD LINE
===================================================== */

.line {

    width: 70px;

    height: 2px;

    margin: 22px auto 30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e8bd65,
            transparent
        );

}


/* =====================================================
   LETTER
===================================================== */

#letter {

    text-align: left;

    white-space: pre-line;

    color: #f0d8dc;

    font-size: 18px;

    line-height: 1.9;

}


/* =====================================================
   SIGNATURE
===================================================== */

.signature {

    margin-top: 35px;

    padding-top: 20px;

    border-top:
        1px solid
        rgba(255, 215, 140, 0.12);

    text-align: right;

    color: #ffd98f;

    font-size: 19px;

    line-height: 1.7;

}


/* =====================================================
   SURPRISE / QR SECTION
===================================================== */

.surprise-section {

    margin-top: 32px;

    padding-top: 28px;

    border-top:
        1px solid
        rgba(255, 210, 130, 0.15);

    text-align: center;

}


.surprise-section h2 {

    margin: 0 0 10px;

    color: #ffd98f;

    font-size: 23px;

    font-weight: normal;

}


.surprise-section p {

    margin: 0 0 20px;

    color: #d9bcc3;

    font-family: Arial, sans-serif;

    font-size: 14px;

    line-height: 1.7;

}


.qr-image {

    display: block;

    width: 210px;

    height: 210px;

    object-fit: contain;

    margin: 20px auto;

    padding: 8px;

    background: white;

    border-radius: 18px;

    box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.4);

}


/* =====================================================
   EXPERIENCE AGAIN BUTTON
===================================================== */

.again-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    max-width: 280px;

    min-height: 52px;

    margin-top: 30px;

    padding: 14px 22px;

    border:
        1px solid
        rgba(232, 189, 101, 0.8);

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #8b1f3e,
            #4b1022
        );

    color: #ffe4a1;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 0.5px;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.3);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


.again-button:active {

    transform: scale(0.97);

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 700px) {

    body {

        align-items: flex-start;

        padding: 20px 15px;

    }

    .letter-card {

        padding: 38px 28px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    body {

        min-height: 100svh;

        padding: 12px 10px;

        align-items: flex-start;

    }


    .letter-card {

        width: 100%;

        margin: 8px auto 25px;

        padding: 30px 20px 28px;

        border-radius: 25px;

    }


    .label {

        font-size: 9px;

        letter-spacing: 3px;

        margin-bottom: 12px;

    }


    h1 {

        font-size: 29px;

        line-height: 1.3;

    }


    .rakhi {

        margin: 16px 0;

        font-size: 42px;

    }


    .line {

        width: 55px;

        margin: 18px auto 25px;

    }


    #letter {

        font-size: 16px;

        line-height: 1.85;

    }


    .signature {

        margin-top: 28px;

        padding-top: 18px;

        font-size: 17px;

    }


    .surprise-section {

        margin-top: 28px;

        padding-top: 23px;

    }


    .surprise-section h2 {

        font-size: 21px;

    }


    .surprise-section p {

        font-size: 13px;

        line-height: 1.6;

    }


    .qr-image {

        width: 190px;

        height: 190px;

        margin: 18px auto;

    }


    .again-button {

        max-width: none;

        margin-top: 25px;

        min-height: 50px;

        font-size: 13px;

    }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    body {

        padding:
            8px 8px;

    }


    .letter-card {

        margin-top: 5px;

        padding:
            25px 17px 22px;

        border-radius: 22px;

    }


    .label {

        font-size: 8px;

        letter-spacing: 2.5px;

    }


    h1 {

        font-size: 26px;

    }


    .rakhi {

        font-size: 38px;

        margin: 13px 0;

    }


    #letter {

        font-size: 15px;

        line-height: 1.75;

    }


    .signature {

        font-size: 16px;

    }


    .surprise-section h2 {

        font-size: 19px;

    }


    .qr-image {

        width: 175px;

        height: 175px;

    }

}


/* =====================================================
   TOUCH DEVICES
===================================================== */

@media (hover: none) {

    .again-button:hover {

        transform: none;

    }

}

</style>

</head>


<body>


<div class="letter-card">


    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="label">

        THIS ONE IS JUST FOR YOU ✦

    </div>


    <h1 id="brotherTitle">

        Happy Rakhi ❤️

    </h1>


    <div class="rakhi">

        🎀

    </div>


    <div class="line"></div>


    <!-- =================================================
         LETTER
    ================================================= -->

    <div id="letter">

        Loading your letter...

    </div>


    <!-- =================================================
         SIGNATURE
    ================================================= -->

    <div class="signature">

        With lots of love,<br>

        Your Sister ❤️

    </div>


    <!-- =================================================
         QR SURPRISE
    ================================================= -->

    <div class="surprise-section">

        <h2>

        <p>

            Since you got your Rakhi...<br>

        <img
            class="qr-image"

    </div>


    <!-- =================================================

    ================================================= -->

    <a
        class="again-button"

    </a>


</div>


<script>


/* =====================================================

const brothers = {

No matter how much we fight, you’ll always be my favourite headache. 😂`

   NO BROTHER FOUND

    brotherTitle.textContent =
        "Oops! ❤️";


    letter.textContent =
        "We couldn't find your Rakhi selection. Please go back and choose your name again.";

}

</script>


</body>

</html>
